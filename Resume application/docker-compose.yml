#      - backend
#    volumes:
#      - ./Backend:/app
#    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
